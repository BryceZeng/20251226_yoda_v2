new_cluster: &new_cluster
  new_cluster:
    num_workers: 3
    spark_version: 15.3.x-cpu-ml-scala2.12
    node_type_id: Standard_DS3_v2
    data_security_mode: "SINGLE_USER"
    custom_tags:
      clusterSource: mlops-stacks_0.4

common_permissions: &permissions
  permissions:
    - level: CAN_VIEW
      group_name: users
    - user_name: ${workspace.current_user.userName}
      level: CAN_MANAGE

resources:
  jobs:
    feature_engineering_workflow_job:
      name: ${bundle.target}-${var.PROJECT_NAME}-write-feature-table-job
      job_clusters:
        - job_cluster_key: write_feature_table_job_cluster
          <<: *new_cluster
      tasks:
        - task_key: GroundTruth
          job_cluster_key: write_feature_table_job_cluster
          notebook_task:
            notebook_path: ../../ADB/NOTEBOOKS/src/feature_engineering/notebooks/CreateGroundTruth.ipynb
            base_parameters:
              CATALOG: ${var.CATALOG}
              SCHEMA: ${var.SCHEMA}
              START_DATE: "2023-10-01"
              END_DATE: "2025-06-01"
              PROJECT_NAME: ${var.PROJECT_NAME}
              # git source information of current ML resource deployment. It will be persisted as part of the workflow run
              git_source_info: url:${bundle.git.origin_url}; branch:${bundle.git.branch}; commit:${bundle.git.commit}
      schedule:
        quartz_cron_expression: "0 0 7 * * ?" # daily at 7am
        timezone_id: UTC
        pause_status: PAUSED
      <<: *permissions
      # If you want to turn on notifications for this job, please uncomment the below code,
      # and provide a list of emails to the on_failure argument.
      #
      #  email_notifications:
      #    on_failure:
      #      - first@company.com
      #      - second@company.com
