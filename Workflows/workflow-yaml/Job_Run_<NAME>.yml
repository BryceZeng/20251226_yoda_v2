resources:
  jobs:
    model_inference:
      name: model_inference
      # job_clusters:
      #   - job_cluster_key: job_cluster
      #     new_cluster:
      #       spark_version: 16.4.x-scala2.12
      #       node_type_id: Standard_D3_v2
      #       autoscale:
      #         min_workers: 1
      #         max_workers: 5
      tags:
        Billing: AI
        Division: AI
        Project: PACS-743
      description: "Job_to_run"
      timeout_seconds: 9800
      health:
        rules:
          - metric: RUN_DURATION_SECONDS
            op: GREATER_THAN
            value: 8820
      schedule:
        quartz_cron_expression: 0 0 3 1 * ?
        timezone_id: UTC
        pause_status: UNPAUSED
      tasks:
        - task_key: Job_to_run
          notebook_task:
            notebook_path: ADB/NOTEBOOKS/src/pipelines/inference
            source: GIT
          existing_cluster_id: ${var.cluster_id}
          # job_cluster_key: job_cluster
      git_source:
        git_url: https://github.com/pru-pacs/pacs-743-mlops_template.git
        git_provider: gitHub
      queue:
        enabled: true


targets:
  dev:
    resources:
      jobs:
        inference_job:
          schedule:
            pause_status: PAUSED
          permissions:
            - user_name: ${var.user_email}
              level: CAN_MANAGE
          run_as:
            user_name: ${var.user_email}
          git_source:
            git_branch: feature/gitops_setup
        training_job:
          schedule:
            pause_status: PAUSED
          permissions:
            - user_name: ${var.user_email}
              level: CAN_MANAGE
          run_as:
            user_name: ${var.user_email}
          git_source:
            git_branch: feature/gitops_setup
  prod:
    resources:
      jobs:
        inference_job:
          schedule:
            pause_status: UNPAUSED
          permissions:
            - user_name: supportpdhadb@prudential.com.sg
              level: CAN_MANAGE
          run_as:
            user_name: srvsglifephdpdbrick@prudential.com.sg
          tasks:
            - task_key: inference_job
              notebook_task:
                notebook_path: /Shared/ai_engineering_feature_engineering/src/pipelines/inference
                source: WORKSPACE
              existing_cluster_id: ${var.cluster_id}


        training_job:
          schedule:
            pause_status: PAUSED
          permissions:
            - user_name: supportpdhadb@prudential.com.sg
              level: CAN_MANAGE
          run_as:
            user_name: srvsglifephdpdbrick@prudential.com.sg
          tasks:
            - task_key: training_job
              notebook_task:
                notebook_path: /Shared/ai_engineering_feature_engineering/src/training/model_v1
                source: WORKSPACE
              existing_cluster_id: ${var.cluster_id}