# =============================================================================
# User Acceptance Testing (UAT) Environment Variable Configuration
# =============================================================================
# This file contains environment-specific variables for the UAT target.
# Variables defined here will be used by Databricks workflows and jobs.
#
# Variable Structure:
# - default: Default value if not overridden
# - description: Human-readable description of the variable's purpose
# - lookup: Dynamic resolution from Databricks workspace (warehouse, cluster, etc.)
# - type: Variable type (simple, complex, etc.)
# =============================================================================

variables:
   # =============================================================================
   # Core Configuration Parameters
   # =============================================================================

   TASK_KEY:
      description: "Default task key identifier for workflow tasks"
      default: DEFAULT

   SCHEMA:
      description: "Database schema name for feature store and model artifacts"
      default: pac_mlops

   CATALOG:
      description: "Unity Catalog name for data and model storage (UAT)"
      default: pru_uat

   # =============================================================================
   # Data Path Configuration
   # =============================================================================

   TRAINING_DATA_PATH:
      description: "Path to training data in Unity Catalog volumes (UAT)"
      default: /Volumes/pru_uat/pac_mlops/test

   # =============================================================================
   # Model Configuration
   # =============================================================================

   MODEL_NAME:
      description: "Source model name in MLflow model registry"
      default: pru.pac_mlops.pac_mlops-model

   DEST_MODEL_NAME:
      description: "Destination model name for promotion workflow (UAT)"
      default: pru_uat.pac_mlops.pac_mlops-model

   EXPERIMENT_NAME:
      description: "MLflow experiment name for model tracking (UAT)"
      default: /uat-pac_mlops-experiment

   # =============================================================================
   # Feature Store Configuration
   # =============================================================================

   SIMPLE_FEATURES_TABLE:
      description: "Feature store table for simple trip features"
      default: pru_uat.pac_mlops.trip_simple_features

   # PICKUP_FEATURES_TABLE and DROP_FEATURES_TABLE removed - using SIMPLE_FEATURES_TABLE instead
   # PICKUP_FEATURES_TABLE:
   #    description: "Feature store table for pickup location features"
   #    default: pru_uat.pac_mlops.trip_pickup_features

   # DROP_FEATURES_TABLE:
   #    description: "Feature store table for dropoff location features"
   #    default: pru_uat.pac_mlops.trip_dropoff_features

   # =============================================================================
   # Inference Configuration
   # =============================================================================

   INFERENCE_INPUT_TABLE:
      description: "Input table for batch inference pipeline (UAT)"
      default: pru_uat.pac_mlops.feature_store_inference_input

   OUTPUT_PREDICTION_TABLE:
      description: "Output table for prediction results (UAT)"
      default: pru_uat.pac_mlops.predictions

   GROUND_TRUTH_TABLE:
      description: "Ground truth table for model validation (UAT)"
      default: pru_uat.pac_mlops.ground_truth

   # =============================================================================
   # Model Training Parameters
   # =============================================================================

   PROJECT_NAME:
      description: "Project identifier for tracking and organization"
      default: customer_churn_lightgbm

   ID_COL:
      description: "Primary key column name for predictions"
      default: pickup_zip

   PREDICTION_COL:
      description: "Target column name for model predictions"
      default: fare_amount

   GROUND_TRUTH_COL:
      description: "Ground truth column name for validation (same as PREDICTION_COL)"
      default: fare_amount

   GRANULARITY:
      description: "Granularity level for predictions (e.g., party, claims, agent, policy)"
      default: party

   # =============================================================================
   # Compute Configuration
   # =============================================================================

   cluster_id:
      description: "Databricks cluster ID for job execution (UAT)"
      default: 0917-015226-4kipf3hu

   # =============================================================================
   # Scheduling Configuration
   # =============================================================================

   FE_JOB_FREQUENCY:
      description: "Feature engineering job execution frequency"
      default: weekly

   JOB_FREQUENCY:
      description: "General job execution frequency (alias for FE_JOB_FREQUENCY)"
      default: weekly

   # =============================================================================
   # Git Integration Configuration
   # =============================================================================

   GIT_URL:
      description: "Git repository URL for source code tracking (UAT)"
      default: "https://github.com/pru-pacs/pacs-743-mlops_template.git"

   GIT_BRANCH:
      description: "Git branch for UAT environment"
      default: "release/uat"

   # =============================================================================
   # Environment Configuration
   # =============================================================================

   ENVIRONMENT:
      description: "Current deployment environment identifier"
      default: "uat"

   ENV:
      description: "Environment variable (alias for ENVIRONMENT)"
      default: "uat"

   # =============================================================================
   # Databricks Workspace Resources (UAT)
   # =============================================================================

   WAREHOUSE_ID:
      description: "Resolve warehouse ID from warehouse name (UAT)"
      lookup:
        warehouse: "Test-Compute"

   # =============================================================================
   # Standard Workflow Tags (UAT)
   # =============================================================================

   WORKFLOW_STANDARD_TAGS:
      description: "Standard tags used for Feature Store workflow (UAT)"
      type: complex
      default:
        department: AI
        environment: ${var.ENVIRONMENT}
        last_update: n/a
        project: ${var.PROJECT_NAME}
        scope: UAT_TESTING

   # =============================================================================
   # Advanced Configuration (Available for UAT Use)
   # =============================================================================
   # These configurations are ready for UAT testing when needed

