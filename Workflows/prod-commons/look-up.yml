# =============================================================================
# Production Environment Variable Configuration
# =============================================================================
# This file contains environment-specific variables for the production target.
# Variables defined here will be used by Databricks workflows and jobs.
#
# Variable Structure:
# - default: Default value if not overridden
# - description: Human-readable description of the variable's purpose
# - lookup: Dynamic resolution from Databricks workspace (warehouse, cluster, etc.)
# - type: Variable type (simple, complex, etc.)
# =============================================================================

variables:
   # =============================================================================
   # Core Configuration Parameters
   # =============================================================================

   TASK_KEY:
      description: "Default task key identifier for workflow tasks"
      default: DEFAULT

   SCHEMA:
      description: "Database schema name for feature store and model artifacts"
      default: prj_yoda

   CATALOG:
      description: "Unity Catalog name for data and model storage (production)"
      default: ai_engineering

   # =============================================================================
   # Data Path Configuration
   # =============================================================================

   TRAINING_DATA_PATH:
      description: "Path to training data in Unity Catalog volumes"
      default: /Volumes/ai_engineering/prj_yoda

   # =============================================================================
   # Model Configuration
   # =============================================================================

   MODEL_NAME:
      description: "Model name (without catalog/schema prefix) for MLflow model registry"
      default: yoda_model

   DEST_MODEL_NAME:
      description: "Destination model name (without catalog/schema prefix) for promotion workflow (production)"
      default: yoda_model

   EXPERIMENT_NAME:
      description: "MLflow experiment name for model tracking (production)"
      default: /prod-yoda_v2-experiment

   # =============================================================================
   # Feature Store Configuration (OPTIONAL)
   # =============================================================================

   SIMPLE_FEATURES_TABLE:
      description: "Feature store table for simple trip features"
      default: ai_engineering.prj_yoda.trip_simple_features

   # PICKUP_FEATURES_TABLE and DROP_FEATURES_TABLE removed - using SIMPLE_FEATURES_TABLE instead
   # PICKUP_FEATURES_TABLE:
   #    description: "Feature store table for pickup location features"
   #    default: ai_engineering.prj_yoda.trip_pickup_features

   # DROP_FEATURES_TABLE:
   #    description: "Feature store table for dropoff location features"
   #    default: ai_engineering.prj_yoda.trip_dropoff_features

   # =============================================================================
   # Inference Configuration
   # =============================================================================

   INFERENCE_INPUT_TABLE:
      description: "Input table for batch inference pipeline (production)"
      default: ai_engineering.prj_yoda.feature_store_inference_input

   OUTPUT_PREDICTION_TABLE:
      description: "Output table for prediction results (production)"
      default: ai_engineering.feature_store.predictions

   GROUND_TRUTH_TABLE:
      description: "Ground truth table for model validation (production)"
      default: ai_engineering.feature_store.ground_truth

   # =============================================================================
   # Model Training Parameters
   # =============================================================================

   PROJECT_NAME:
      description: "Project identifier for tracking and organization"
      default: yoda_v2

   ID_COL:
      description: "Primary key column name for predictions"
      default: party_id

   PREDICTION_COL:
      description: "Target column name for model predictions (multiclass: 0=no purchase, 1-7=different product types)"
      default: target

   GROUND_TRUTH_COL:
      description: "Ground truth column name for validation (same as PREDICTION_COL)"
      default: target

   GRANULARITY:
      description: "Granularity level for predictions (e.g., party, claims, agent, policy)"
      default: party

   # =============================================================================
   # Scheduling Configuration
   # =============================================================================

   FE_JOB_FREQUENCY:
      description: "Feature engineering job execution frequency"
      default: monthly

   JOB_FREQUENCY:
      description: "General job execution frequency (alias for FE_JOB_FREQUENCY)"
      default: monthly

   # =============================================================================
   # Git Integration Configuration
   # =============================================================================

   GIT_URL:
      description: "Git repository URL for source code tracking (production)"
      default: "https://github.com/pru_prod-pacs/pacs-743-ai_engineering_feature_engineering.git"

   GIT_BRANCH:
      description: "Git branch for production environment"
      default: "main"

   # =============================================================================
   # Environment Configuration
   # =============================================================================

   ENVIRONMENT:
      description: "Current deployment environment identifier"
      default: "prod"

   ENV:
      description: "Environment variable (alias for ENVIRONMENT)"
      default: "prod"

   # =============================================================================
   # Databricks Workspace Resources (Production)
   # =============================================================================

   WAREHOUSE_ID:
      description: "Resolve warehouse ID from warehouse name (production)"
      lookup:
        warehouse: "AI-Compute"

   cluster_id:
      description: "Resolve cluster ID from cluster name (production)"
      lookup:
        cluster: "Unity Catalog"

   # =============================================================================
   # Standard Workflow Tags (Production)
   # =============================================================================

   WORKFLOW_STANDARD_TAGS:
      description: "Standard tags used for Feature Store workflow (production)"
      type: complex
      default:
        department: AI
        environment: ${var.ENVIRONMENT}
        last_update: n/a
        project: ${var.PROJECT_NAME}
        scope: PRODUCTION

   # =============================================================================
   # Advanced Configuration (Available for Production Use)
   # =============================================================================
