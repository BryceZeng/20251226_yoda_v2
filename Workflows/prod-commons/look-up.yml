variables:
   TASK_KEY:
      default: DEFAULT
   SCHEMA:
      default: pac_mlops
   CATALOG:
      default: pru_prod
   TRAINING_DATA_PATH:
      default: /Volumes/pru_prod/pac_mlops/test
   MODEL_NAME:
      default: pru.pac_mlops.pac_mlops-model
   DEST_MODEL_NAME:
      default: pru_prod.pac_mlops.pac_mlops-model
   PICKUP_FEATURES_TABLE:
      default: pru_prod.pac_mlops.trip_pickup_features
   DROP_FEATURES_TABLE:
      default: pru_prod.pac_mlops.trip_dropoff_features
   EXPERIMENT_NAME:
      default: /dev-pac_mlops-experiment
   INFERENCE_INPUT_TABLE:
      default: pru_prod.pac_mlops.feature_store_inference_input
   OUTPUT_PREDICTION_TABLE:
      default: pru_prod.pac_mlops.predictions

    GIT_URL:
        description: "Git url"
        default: "https://github.com/pru_prod-pacs/pacs-743-ai_engineering_feature_engineering.git"

    GIT_BRANCH:
      description: "Git branch"
      default: "main"

    ENVIRONMENT:
      description: "Environment"
      default: "prod"

    WAREHOUSE_ID:
      description: "Resolve warehouse ID from warehouse name"
      lookup:
        warehouse: "AI-Compute"

    WORKFLOW_STANDARD_TAGS:
      description: Standard tags used for Feature Store workflow
      type: complex
      default:
        department: AI
        environment: ${var.ENVIRONMENT}
        last_update: n/a
        project: DEFAULT
        scope: DEFAULT

    cluster_id:
      description: "Resolve cluster ID from cluster name"
      lookup:
        cluster: "Unity Catalog"

