new_cluster: &new_cluster
  new_cluster:
    num_workers: 3
    spark_version: 15.3.x-cpu-ml-scala2.12
    node_type_id: Standard_DS3_v2
    data_security_mode: "SINGLE_USER"
    custom_tags:
      clusterSource: mlops-stacks_0.4

common_permissions: &permissions
  permissions:
    - level: CAN_VIEW
      group_name: users

resources:
  jobs:
    promote_model_workflow_job:
      name: ${bundle.target}-${var.PROJECT_NAME}-promote-model-job
      tasks:
        - task_key: promote_model_job
          # existing_cluster_id: ${var.cluster_id}
          <<: *new_cluster
          notebook_task:
            notebook_path: ../../ADB/NOTEBOOKS/src/promote/promote_model.ipynb
            base_parameters:
              MODEL_NAME: ${var.MODEL_NAME}
              ENV : ${bundle.target}
              DEST_MODEL_NAME: ${var.DEST_MODEL_NAME}
              git_source_info: url:${bundle.git.origin_url}; branch:${bundle.git.branch}; commit:${bundle.git.commit}

      schedule:
        quartz_cron_expression: "0 0 11 * * ?" # daily at 11am
        timezone_id: UTC
        pause_status: PAUSED
      <<: *permissions
      # If you want to turn on notifications for this job, please uncomment the below code,
      # and provide a list of emails to the on_failure argument.
      #
      #  email_notifications:
      #    on_failure:
      #      - first@company.com
      #      - second@company.com
