common_permissions: &permissions
  permissions:
    - level: CAN_VIEW
      group_name: users

resources:
  jobs:
    unit_test_job:
      name: ${bundle.target}-pac_mlops-unit-test-job
      tasks:
        - task_key: RunUnitTests
          notebook_task:
            notebook_path: ../../ADB/NOTEBOOKS/src/tests/unit_tests.py
          environment_key: Default
      environments:
        - environment_key: Default
          spec:
            environment_version: "4"
            base_parameters:
              ENV: ${bundle.target}
              git_source_info: url:${bundle.git.origin_url}; branch:${bundle.git.branch}; commit:${bundle.git.commit}
      schedule:
        quartz_cron_expression: "0 0 11 * * ?" # daily at 11am
        timezone_id: UTC
        pause_status: PAUSED
      <<: *permissions

