# This is a Databricks asset bundle definition for asset_bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: project_name

variables:
  folder_name:
    default: ''

include:
  - ./../../Workflows/workflow-yaml/*.yml
  - ./../../Workflows/${bundle.target}-commons/*.yml

targets:
  dev:
    mode: production
    default: false
    # Include environment-specific variables
    variables:
      environment: dev
    workspace:
      root_path: ${var.folder_name}
      file_path: ${var.folder_name}
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
    # run_as:
    #   user_name: ${workspace.current_user.userName}
  uat:
    mode: production
    default: false
    # Include environment-specific variables
    variables:
      environment: uat
    workspace:
      root_path: ${var.folder_name}
      file_path: ${var.folder_name}
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
    # run_as:
    #   user_name: ${workspace.current_user.userName}
  prod:
    mode: production
    default: false
    # Include environment-specific variables
    variables:
      environment: prod
    workspace:
      root_path: ${var.folder_name}
      file_path: ${var.folder_name}
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
    # run_as:
    #   user_name: ${workspace.current_user.userName}