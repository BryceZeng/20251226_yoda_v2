# Databricks asset bundle definition for unit tests
# This bundle deploys only the unit test workflow
bundle:
  name: project_name_unittest

variables:
  folder_name:
    default: ''

include:
  - ./../../Test/*.yml

targets:
  dev:
    mode: production
    default: false

    workspace:
      root_path: ${var.folder_name}
      file_path: ${var.folder_name}   
    permissions:  
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE

