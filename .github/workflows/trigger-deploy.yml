name: Caller Workflow
on:
  push:
    branches:
      - master
      - develop
      - feature/bryce_v5

jobs:
    call-master:
      if: github.ref == 'refs/heads/master'
      uses: pru-pss/pss-eta-reusable_workflows/.github/workflows/pacs-datahub-ai-mlops-databricks-asset-bundle.yml@main
      with:
        ENVIRONMENT: prod
        PROJECT_NAME: pacs-743-model-deployment-template
        FOLDER_NAME: /Workspace/Projects/pacs-743-model-deployment-template
        RUNNER: prod-runner
        JOB_NAME: promote_model_workflow_job
      secrets:
              TOKEN: ${{ secrets.PERSONAL_PRD2_ACCESS_TOKEN }}
              HOST : ${{secrets.DATABRICKS_PRD2_HOST}}
              GIT_TOKEN : ${{secrets.GIT_TOKEN}}

    call-develop:
      if: github.ref == 'refs/heads/develop'
      uses: pru-pss/pss-eta-reusable_workflows/.github/workflows/pacs-datahub-ai-mlops-databricks-asset-bundle.yml@main
      with:
        ENVIRONMENT: dev
        PROJECT_NAME: pacs-743-model-deployment-template
        FOLDER_NAME: /Workspace/Projects/pacs-743-model-deployment-template
        RUNNER: dev-runner
        JOB_NAME: model_training_job
        UNIT_TEST_JOB_NAME: unit_test_job
      secrets:
              TOKEN: ${{ secrets.PERSONAL_DEV3_ACCESS_TOKEN }}
              HOST : ${{secrets.DATABRICKS_DEV3_HOST}}
              GIT_TOKEN : ${{secrets.GIT_TOKEN}}

    call-feature:
      if: github.ref == 'refs/heads/feature/bryce_v4'
      uses: ./.github/workflows/pacs-datahub-ai-mlops-databricks-asset-bundle.yml
      with:
        ENVIRONMENT: dev
        PROJECT_NAME: pacs-743-model-deployment-template
        FOLDER_NAME: /Workspace/pacs-743-model-deployment-template
        RUNNER: dev-runner
        TRAINING_JOB_NAME: model_training_job
        PROMOTE_MODEL_JOB_NAME: promote_model_workflow_job
        FEATURE_ENGINEERING_JOB_NAME: feature_engineering_workflow_job
        BATCH_INFERENCE_JOB_NAME: batch_inference_workflow_job
        UNIT_TEST_JOB_NAME: unit_test_job
      secrets:
              TOKEN: ${{ secrets.PERSONAL_DEV3_ACCESS_TOKEN }}
              HOST : ${{secrets.DATABRICKS_DEV3_HOST}}
              GIT_TOKEN : ${{secrets.GIT_TOKEN}}